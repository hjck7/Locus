name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project Locus.xcodeproj \
            -target Locus \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Locus.app Payload/
          zip -qry Locus-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Locus-unsigned-ipa
          path: Locus-unsigned.ipa
